<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173765">
<title>Salles Horizons CNP-PS</title>
<style>
:root{--navy:#173765;--pink:#ff005d;--yellow:#ffd323;--bg:#f3f6f9;--line:#d8e0e8;--text:#15253a;--muted:#66758a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:max(12px,env(safe-area-inset-top)) 18px 12px;border-bottom:4px solid var(--pink)}.top-inner{max-width:1180px;margin:auto}.top b{font-size:19px}.top span{display:block;font-size:12px;opacity:.75}
main{max-width:1180px;margin:auto;padding:16px;display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px}.panel,.map-card,.info{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 26px #16385e18}.panel{padding:16px;align-self:start}.panel h1{font-size:22px;margin:0 0 5px}.lead{font-size:13px;color:var(--muted);margin:0 0 14px}
.search{position:relative}.search input{width:100%;height:48px;border:2px solid var(--navy);border-radius:11px;padding:0 40px 0 13px;outline:0}.clear{position:absolute;right:7px;top:7px;width:34px;height:34px;border:0;border-radius:8px;background:#edf2f6;display:none}.suggest{display:none;position:absolute;top:54px;left:0;right:0;z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 14px 30px #17376530}.suggest.open{display:block}.suggest button{width:100%;border:0;background:#fff;border-radius:7px;padding:9px;display:flex;justify-content:space-between;text-align:left}.suggest button:hover{background:#eef5fa}.suggest small,.list small{color:var(--muted)}.list button>span:first-child{display:flex;flex-direction:column;gap:5px;min-width:0}.list button b{display:block;line-height:1.2}.list button small{display:block;line-height:1.25}
.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.floors button{padding:9px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:700}.floors button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.list-title{font-size:12px;color:var(--muted);margin:0 3px 4px}.list{max-height:480px;overflow:auto}.list button{width:100%;border:0;border-left:3px solid transparent;background:#fff;border-radius:8px;padding:9px;display:flex;justify-content:space-between;align-items:center;text-align:left}.list button:hover{background:#f0f6fa}.list button.selected{background:#eaf3f9;border-left-color:var(--pink)}.cap{font-size:11px;background:#edf2f6;padding:4px 7px;border-radius:15px;white-space:nowrap}
.map-head{display:flex;align-items:end;justify-content:space-between;margin:0 2px 8px}.map-head small{color:var(--pink);font-weight:800;letter-spacing:.12em}.map-head h2{font-size:22px;margin:2px 0}.map-head button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px}.map-card{position:relative;overflow:visible;background:#fff;min-height:310px;display:grid;place-items:center}.stage{position:relative;width:100%;line-height:0}.stage img{display:block;width:100%;height:auto}
.marker{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;box-shadow:0 0 0 5px rgba(255,211,35,.60),0 0 17px rgba(255,211,35,.95),0 0 29px rgba(255,0,93,.72);opacity:0;pointer-events:none;line-height:1;z-index:20}.marker.show{opacity:1;animation:haloPulse 1.55s infinite}.marker::after{content:attr(data-room);position:absolute;bottom:38px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--pink);color:#fff;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:800;box-shadow:0 5px 16px rgba(0,0,0,.28);opacity:0}.marker.show::after{opacity:1}.marker::before{content:"";position:absolute;bottom:29px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid var(--pink);opacity:0}.marker.show::before{opacity:1}
@keyframes haloPulse{0%,100%{box-shadow:0 0 0 5px rgba(255,211,35,.62),0 0 17px rgba(255,211,35,.95),0 0 29px rgba(255,0,93,.70)}50%{box-shadow:0 0 0 11px rgba(255,211,35,.16),0 0 29px rgba(255,211,35,1),0 0 44px rgba(255,0,93,.86);transform:translate(-50%,-50%) scale(1.08)}}
.info{display:none;margin-top:12px;padding:14px 16px;border-left:5px solid var(--pink)}.info.show{display:flex;justify-content:space-between;align-items:center;gap:10px}.info h3{margin:0 0 3px;font-size:21px}.info p{margin:0;color:var(--muted)}.badge{background:var(--navy);color:#fff;border-radius:24px;padding:8px 11px;font-weight:800;white-space:nowrap}.note{font-size:10px;color:var(--muted);margin:8px 3px}.empty{padding:9px;color:var(--muted)}
@media(max-width:760px){main{display:block;padding:12px}.panel{padding:13px}.panel h1{font-size:20px}.list{max-height:190px}.work{margin-top:14px}.map-card{min-height:205px}.marker{width:24px;height:24px;font-size:10px;border-width:2px}.marker::after{bottom:35px;font-size:12px;padding:6px 9px}.marker::before{bottom:26px}.map-head h2{font-size:20px}.info.show{align-items:flex-start}.badge{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><b>Salles Horizons CNP-PS</b><span>Trouvez visuellement votre salle</span></div></header>
<main>
<aside class="panel"><h1>Où se trouve ma salle ?</h1><p class="lead">Recherchez son nom ou choisissez-la dans la liste.</p><div class="search"><input id="q" autocomplete="off" placeholder="Ex. Vision, Synergie, Jardin"><button id="clear" class="clear" aria-label="Effacer">×</button><div id="suggest" class="suggest"></div></div><div class="floors"><button data-floor="4">4e</button><button data-floor="5" class="active">5e</button><button data-floor="6">6e</button></div><div id="listTitle" class="list-title"></div><div id="list" class="list"></div></aside>
<section class="work"><div class="map-head"><div><small>PLAN</small><h2 id="floorTitle">5e étage</h2></div><button id="reset">Effacer la sélection</button></div><div class="map-card"><div id="stage" class="stage"><img id="plan" src="etage5.png" alt="Plan du 5e étage"><div id="marker" class="marker"></div></div></div><div id="info" class="info"><div><h3 id="roomName"></h3><p id="roomMeta"></p></div><div id="roomNo" class="badge"></div></div><p class="note">Les repères ont été positionnés à partir du plan fourni. Vérification recommandée avant diffusion générale.</p></section>
</main>
<script>
const rooms=[
['Clarté',1,4,8,63,45.3],['Orée',2,4,10,65.3,57],['Levant',3,4,8,67.8,56.7],['Atmosphère',4,4,4,72.1,41.5],['Tropique',5,4,4,73,48],['Jardin',6,4,6,76,41.4],
['Alizé',7,5,10,13.7,53.5],['Union',8,5,6,16,42.8],['Aventure',9,5,12,17.3,53.8],['Évasion',10,5,16,20.2,58],['Percée',11,5,10,34,69.1],['Nomade',12,5,10,37.2,67.9],['Aube',13,5,4,37.8,55.6],['Éclaircie',14,5,4,38,48.7],['Sommet',15,5,10,38.2,39.4],['Aurore',16,5,4,40.4,54.2],['Sillage',17,5,10,49,46.2],['Élan',18,5,6,54.9,57.4],['Synergie',19,5,32,61,27.9],['Ciel',20,5,4,73.3,26.7],['Perspective',21,5,16,76.1,26.5],['Source',22,5,4,78,39],
['Vision',23,6,22,15.9,59.6],['Cime',24,6,10,36.2,59.8],['Canopée',25,6,4,45.5,54.1],['Solstice',26,6,3,52,56.8],['Essor',27,6,3,55.2,61],['Envol',28,6,10,60.5,57.3],['Cap',29,6,10,79,53.7]
].map(a=>({nom:a[0],numero:a[1],etage:a[2],capacite:a[3],x:a[4],y:a[5]}));
const $=s=>document.querySelector(s),norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let floor=5,selected=null;
function renderList(){const a=rooms.filter(r=>r.etage===floor);$('#listTitle').textContent=`${a.length} salles au ${floor}e étage`;$('#list').innerHTML=a.map(r=>`<button data-room="${r.numero}" class="${selected?.numero===r.numero?'selected':''}"><span><b>${r.nom}</b><small>Repère n°${r.numero}</small></span><span class="cap">${r.capacite} pers.</span></button>`).join('');document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>selectRoom(rooms.find(r=>r.numero===+b.dataset.room)))}
function setFloor(n){floor=n;selected=null;$('#plan').src=`etage${n}.png`;$('#plan').alt=`Plan du ${n}e étage`;$('#floorTitle').textContent=`${n}e étage`;$('#marker').classList.remove('show');$('#info').classList.remove('show');document.querySelectorAll('[data-floor]').forEach(b=>b.classList.toggle('active',+b.dataset.floor===n));renderList()}
function selectRoom(r){if(!r)return;if(floor!==r.etage){floor=r.etage;$('#plan').src=`etage${floor}.png`;$('#plan').alt=`Plan du ${floor}e étage`;$('#floorTitle').textContent=`${floor}e étage`;document.querySelectorAll('[data-floor]').forEach(b=>b.classList.toggle('active',+b.dataset.floor===floor))}selected=r;$('#q').value=r.nom;$('#clear').style.display='block';$('#suggest').classList.remove('open');const m=$('#marker');m.textContent=r.numero;m.setAttribute('data-room',r.nom);m.style.left=r.x+'%';m.style.top=r.y+'%';m.classList.add('show');$('#roomName').textContent=r.nom;$('#roomMeta').textContent=`${r.capacite} personnes · ${r.etage}e étage`;$('#roomNo').textContent=`Repère n°${r.numero}`;$('#info').classList.add('show');renderList()}
function showSuggestions(q){const a=rooms.filter(r=>norm(r.nom).includes(norm(q))).slice(0,8);$('#suggest').innerHTML=a.map(r=>`<button data-s="${r.numero}"><b>${r.nom}</b><small>${r.etage}e · n°${r.numero}</small></button>`).join('')||'<div class="empty">Aucune salle trouvée</div>';$('#suggest').classList.toggle('open',q.length>0);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>selectRoom(rooms.find(r=>r.numero===+b.dataset.s)))}
$('#q').oninput=e=>{$('#clear').style.display=e.target.value?'block':'none';showSuggestions(e.target.value)};$('#clear').onclick=()=>{$('#q').value='';$('#clear').style.display='none';$('#suggest').classList.remove('open');$('#q').focus()};$('#reset').onclick=()=>setFloor(floor);document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>setFloor(+b.dataset.floor));document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#suggest').classList.remove('open')});setFloor(5);
</script>
</body></html>
