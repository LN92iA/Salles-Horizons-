<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#003b70"><title>Salles Horizon</title><style>
:root{--b:#003b70;--o:#f59c00;--r:#e1262f;--bg:#f2f5f8;--line:#dce3ea;--muted:#65758a}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#17263b}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;background:var(--b);color:#fff;border-bottom:4px solid var(--o);padding:13px 18px}header div{max-width:1180px;margin:auto}header b{font-size:19px}header span{display:block;font-size:12px;opacity:.75}main{max-width:1180px;margin:auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:18px}.panel,.map,.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 28px #00244617}.panel{padding:18px;align-self:start}.panel h1{font-size:23px;margin:0 0 6px}.lead{margin:0 0 16px;color:var(--muted);font-size:14px}.search{position:relative}.search input{width:100%;height:49px;border:2px solid var(--b);border-radius:11px;padding:0 40px 0 13px;outline:0}.clear{position:absolute;right:8px;top:8px;width:33px;height:33px;border:0;border-radius:8px;background:#edf2f6;display:none}.suggest{display:none;position:absolute;top:55px;left:0;right:0;z-index:20;background:#fff;border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:0 14px 30px #00244635}.suggest.open{display:block}.suggest button{width:100%;border:0;background:#fff;padding:9px;border-radius:7px;display:flex;justify-content:space-between;text-align:left}.suggest button:hover{background:#edf6fc}.suggest small{color:var(--muted)}.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.floors button{padding:9px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:700}.floors button.active{background:var(--b);color:#fff}.list-title{font-size:12px;color:var(--muted);margin:0 3px 5px}.list{max-height:455px;overflow:auto}.list button{width:100%;border:0;border-left:3px solid transparent;background:#fff;border-radius:8px;padding:9px;display:flex;align-items:center;justify-content:space-between;text-align:left}.list button:hover{background:#f1f7fb}.list button.selected{background:#e5f3fb;border-left-color:var(--b)}.list small{display:block;color:var(--muted)}.cap{font-size:12px;background:#edf2f6;padding:4px 7px;border-radius:15px}.head{display:flex;align-items:end;justify-content:space-between;margin:0 2px 9px}.head small{font-weight:800;letter-spacing:.12em;color:var(--o)}.head h2{margin:2px 0 0}.head button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px}.map{position:relative;overflow:hidden;min-height:420px;display:grid;place-items:center}.stage{position:relative;width:100%;line-height:0;transform-origin:var(--zx,50%) var(--zy,50%);transition:.45s}.stage.zoom{transform:scale(1.32)}.stage img{display:block;width:100%}.hot{position:absolute;padding:0;border:1px dashed #075d9b88;background:#00a5c81a;border-radius:5px}.hot.active{z-index:2;border:4px solid var(--r);background:#ffd70073;box-shadow:0 0 0 7px #ffd70044,0 0 30px 12px #ffd70099;animation:pulse 1.5s infinite}.hot em{position:absolute;left:50%;top:-28px;transform:translateX(-50%);font-style:normal;background:var(--r);color:#fff;padding:4px 7px;border-radius:5px;font-size:9px;font-weight:700;white-space:nowrap;opacity:0;line-height:1}.hot:hover em,.hot.active em{opacity:1}@keyframes pulse{50%{box-shadow:0 0 0 14px #ffd70010,0 0 38px 17px #ffd700aa}}.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#003b70ed;color:white;padding:9px 14px;border-radius:22px;font-size:12px;white-space:nowrap}.card{display:none;margin-top:13px;padding:15px 18px}.card.show{display:block}.card h3{margin:0 0 5px;font-size:21px}.card p{margin:0;color:var(--muted)}.status{background:#fff0cf;color:#9b5e00;border-radius:12px;padding:3px 7px;font-size:11px}.note{font-size:11px;color:var(--muted);margin:9px 4px}
@media(max-width:760px){main{display:block;padding:13px}.panel{padding:14px}.list{max-height:205px}.work{margin-top:15px}.map{min-height:220px}.stage.zoom{transform:scale(1.12)}.hot em,.hint{display:none}.head h2{font-size:21px}}
</style></head><body><header><div><b>Salles Horizon</b><span>Localisez rapidement votre salle</span></div></header><main><aside class="panel"><h1>Où se trouve ma salle ?</h1><p class="lead">Saisissez son nom ou choisissez-la dans la liste.</p><div class="search"><input id="q" placeholder="Ex. Vision, Synergie, Jardin" autocomplete="off"><button id="clear" class="clear">×</button><div id="suggest" class="suggest"></div></div><div class="floors"><button data-floor="4">4e</button><button data-floor="5" class="active">5e</button><button data-floor="6">6e</button></div><div id="listTitle" class="list-title"></div><div id="list" class="list"></div></aside><section class="work"><div class="head"><div><small>PLAN DE L'ÉTAGE</small><h2 id="floorTitle">5e étage</h2></div><button id="reset">Vue complète</button></div><div class="map"><div class="stage" id="stage"><img id="plan" src="plans/etage5.png" alt="Plan du 5e étage"><div id="spots"></div></div><div id="hint" class="hint">Choisissez une salle pour la mettre en évidence</div></div><div id="card" class="card"><h3 id="name"></h3><p id="meta"></p></div><p class="note">Positions approximatives à vérifier sur site avant diffusion générale.</p></section></main><script>
const R=[
['Atmosphère',4,4,55.3,54.7,4,7],['Jardin',4,6,68.6,53.2,4.5,7],['Tropique',4,4,64.2,57,4,7],['Orée',4,10,40,59.2,4.5,7],['Levant',4,8,47,56.6,4.5,7],['Clarté',4,8,42.3,53,4.5,7],
['Union',5,6,25.8,51,4.4,7],['Alize',5,10,28.8,55.2,4.4,7],['Aventure',5,12,31.2,58.3,4.4,7],['Percée',5,10,42.5,61,4.4,7],['Evasion',5,16,35.7,59.5,4.4,7],['Nomade',5,10,49.2,61,4.4,7],['Aube',5,4,55.8,59.3,4,7],['Aurore',5,4,63,56.2,4,7],['Eclaircie',5,4,38,48.5,4,7],['Sommet',5,10,48,48.8,4.4,7],['Sillage',5,10,54.8,47.2,4.4,7,'En travaux'],['Synergie',5,32,66,46.5,5.5,8],['Perspective',5,16,78.5,45.8,5.2,8],['Ciel',5,4,70.8,51.5,4,7],['Source',5,4,85.5,58.5,4,7],
['Vision',6,22,17.2,45,5.5,8],['Cime',6,10,36,48.5,4.5,7],['Canopée',6,4,48,47.3,4,7],['Solstice',6,3,53.2,45,4,7],['Essor',6,3,57,45.5,4,7],['Envol',6,10,62.8,44.3,4.5,7],['Cap',6,10,70.8,42.8,4.5,7]
].map(a=>({nom:a[0],etage:a[1],capacite:a[2],x:a[3],y:a[4],w:a[5],h:a[6],statut:a[7]}));
const $=s=>document.querySelector(s),N=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let F=5,S=null;
function list(){let a=R.filter(r=>r.etage===F).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));$('#listTitle').textContent=`${a.length} salles au ${F}e étage`;$('#list').innerHTML=a.map(r=>`<button data-room="${r.nom}" class="${S?.nom===r.nom?'selected':''}"><span><b>${r.nom}</b><small>${r.statut||F+'e étage'}</small></span><span class="cap">${r.capacite} pers.</span></button>`).join('');document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>select(R.find(r=>r.nom===b.dataset.room)))}
function spots(){let a=R.filter(r=>r.etage===F);$('#spots').innerHTML=a.map(r=>`<button class="hot ${S?.nom===r.nom?'active':''}" data-hot="${r.nom}" style="left:${r.x-r.w/2}%;top:${r.y-r.h/2}%;width:${r.w}%;height:${r.h}%"><em>${r.nom}</em></button>`).join('');document.querySelectorAll('[data-hot]').forEach(b=>b.onclick=()=>select(R.find(r=>r.nom===b.dataset.hot)))}
function floor(n){F=n;S=null;$('#plan').src=`plans/etage${n}.png`;$('#floorTitle').textContent=`${n}e étage`;$('#stage').classList.remove('zoom');$('#card').classList.remove('show');$('#hint').style.display='block';document.querySelectorAll('[data-floor]').forEach(b=>b.classList.toggle('active',+b.dataset.floor===n));list();spots()}
function select(r){if(!r)return;if(F!==r.etage){F=r.etage;$('#plan').src=`plans/etage${F}.png`;$('#floorTitle').textContent=`${F}e étage`;document.querySelectorAll('[data-floor]').forEach(b=>b.classList.toggle('active',+b.dataset.floor===F))}S=r;$('#q').value=r.nom;$('#clear').style.display='block';$('#suggest').classList.remove('open');$('#stage').style.setProperty('--zx',r.x+'%');$('#stage').style.setProperty('--zy',r.y+'%');$('#stage').classList.add('zoom');$('#name').textContent=r.nom;$('#meta').innerHTML=`${r.capacite} personnes · ${r.etage}e étage ${r.statut?`<span class="status">${r.statut}</span>`:''}`;$('#card').classList.add('show');$('#hint').style.display='none';list();spots()}
function suggest(q){let a=R.filter(r=>N(r.nom).includes(N(q))).slice(0,8);$('#suggest').innerHTML=a.map(r=>`<button data-s="${r.nom}"><b>${r.nom}</b><small>${r.etage}e · ${r.capacite} pers.</small></button>`).join('')||'<div style="padding:9px;color:#65758a">Aucune salle</div>';$('#suggest').classList.toggle('open',q.length>0);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>select(R.find(r=>r.nom===b.dataset.s)))}
$('#q').oninput=e=>{$('#clear').style.display=e.target.value?'block':'none';suggest(e.target.value)};$('#clear').onclick=()=>{$('#q').value='';$('#clear').style.display='none';$('#suggest').classList.remove('open')};$('#reset').onclick=()=>floor(F);document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>floor(+b.dataset.floor));document.onclick=e=>{if(!e.target.closest('.search'))$('#suggest').classList.remove('open')};floor(5);
</script></body></html>
